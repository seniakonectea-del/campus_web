{% extends "base.html" %}
{% block title %}Editar Usuario – Campus Web{% endblock %}

{% block content %}
<div class="form-page">
  <h1>✏️ Editar Usuario</h1>

  <form method="POST">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required value="{{ usuario.nombre }}" />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required value="{{ usuario.email }}" />
    </div>
    <div class="form-group">
      <label for="rol">Rol</label>
      <select id="rol" name="rol">
        <option value="alumno"   {% if usuario.rol == 'alumno'   %}selected{% endif %}>Alumno</option>
        <option value="profesor" {% if usuario.rol == 'profesor' %}selected{% endif %}>Profesor</option>
        <option value="admin"    {% if usuario.rol == 'admin'    %}selected{% endif %}>Administrador</option>
      </select>
    </div>
    <div class="form-group">
      <label for="password">Nueva contraseña <small>(dejar vacío para no cambiar)</small></label>
      <input type="password" id="password" name="password" minlength="6" placeholder="••••••" />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
      <a href="{{ url_for('admin.usuarios') }}" class="btn btn-outline">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
