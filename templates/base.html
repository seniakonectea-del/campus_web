<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Konectia</title>
</head>
<body>
    <h1> Campus Konectia</h1>

    {% block content %}{% endblock %}

        <iframe width="600" height="450" style="border:0" loading="lazy" allowfullscreen
    src="https://www.google.com/maps/embed/v1/place?q=place_id:ChIJ78ddXa5LSQ0RNSKO1YA6Go8&key=AIzaSyCGpveplM4ZYNIFuk9eQfnIg0IA80qhzpI"></iframe>
    <script>
        // Mantener sesión activa: ping cada 5 minutos
        const __KEEPALIVE_INTERVAL = 5 * 60 * 1000;
        const __keepAliveTimer = setInterval(() => {
            fetch('{{ url_for("keepalive") }}', { method: 'POST', credentials: 'include' })
                .then(r => {
                    if (r.status === 401) {
                        clearInterval(__keepAliveTimer);
                        window.location = '{{ url_for("index") }}';
                    }
                })
                .catch(() => {});
        }, __KEEPALIVE_INTERVAL);

        async function logoutUser() {
            try {
                await fetch('{{ url_for("logout") }}', { method: 'POST', credentials: 'include' });
            } finally {
                clearInterval(__keepAliveTimer);
                window.location = '{{ url_for("index") }}';
            }
        }
    </script>
</body>
</html>
