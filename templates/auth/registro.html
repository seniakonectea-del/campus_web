{% extends "base.html" %}
{% block title %}Registro – Campus Web{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>🎓 Campus Web</h1>
  <h2>Crear cuenta</h2>

  <form method="POST" action="{{ url_for('auth.registro') }}">
    <div class="form-group">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre" />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="tu@email.com" />
    </div>
    <div class="form-group">
      <label for="password">Contraseña <small>(mínimo 6 caracteres)</small></label>
      <input type="password" id="password" name="password" required minlength="6" />
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirmar contraseña</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="6" />
    </div>
    <button type="submit" class="btn btn-primary w-full">Registrarse</button>
  </form>

  <p class="auth-link">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
</div>
{% endblock %}
