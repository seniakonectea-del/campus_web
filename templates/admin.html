{% extends "base.html" %}
{% block content %}
  <h2>Panel de administración de usuarios</h2>
  <table border="1" cellpadding="4" cellspacing="0">
    <tr><th>Usuario</th><th>Email</th><th>Rol</th><th>Cambiar rol</th></tr>
    {% for u in users %}
      <tr>
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.role }}</td>
        <td>
          <form method="post" action="{{ url_for('change_role', uid=u.id) }}">
            <input type="hidden" name="username" value="{{ u.username }}">
            <select name="role">
              <option{% if u.role=='Alumno' %} selected{% endif %}>Alumno</option>
              <option{% if u.role=='Profesor' %} selected{% endif %}>Profesor</option>
              <option{% if u.role=='Administrador' %} selected{% endif %}>Administrador</option>
            </select>
            <button type="submit">OK</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </table>
  <p><a href="{{ url_for('dashboard') }}">Volver</a></p>
{% endblock %}
