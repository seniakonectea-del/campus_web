<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Registro</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    body.futuristic {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #0ff 0%, rgba(0,0,0,0) 10%),
                  linear-gradient(120deg, #020024 0%, #090979 35%, #00d4ff 100%);
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #e6f7ff;
      position: relative;
    }
    
    /* Formas geométricas tenues de fondo */
    body.futuristic::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        /* Triángulos */
        linear-gradient(135deg, rgba(0,212,255,0.04) 25%, transparent 25%),
        linear-gradient(225deg, rgba(0,212,255,0.04) 25%, transparent 25%),
        linear-gradient(315deg, rgba(100,0,255,0.03) 25%, transparent 25%),
        linear-gradient(45deg, rgba(100,0,255,0.03) 25%, transparent 25%),
        /* Círculos grandes sutiles */
        radial-gradient(circle at 15% 25%, rgba(0,255,150,0.05) 0%, transparent 15%),
        radial-gradient(circle at 85% 75%, rgba(100,50,200,0.04) 0%, transparent 20%),
        radial-gradient(circle at 50% 50%, rgba(0,200,255,0.02) 0%, transparent 25%);
      background-size: 
        60px 60px,
        60px 60px,
        60px 60px,
        60px 60px,
        100% 100%,
        100% 100%,
        100% 100%;
      background-position: 0 0, 30px 30px, 0 0, 30px 30px, 0 0, 0 0, 0 0;
      pointer-events: none;
      animation: geometric-shift 30s ease-in-out infinite;
      z-index: -2;
    }

    @keyframes geometric-shift {
      0% { transform: translateX(0) translateY(0); }
      25% { transform: translateX(10px) translateY(-10px); }
      50% { transform: translateX(0) translateY(10px); }
      75% { transform: translateX(-10px) translateY(-5px); }
      100% { transform: translateX(0) translateY(0); }
    }

    /* Efecto Matrix */
    body.futuristic::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        repeating-linear-gradient(0deg, rgba(0,255,100,0.03) 0px, transparent 1px, transparent 2px, rgba(0,255,100,0.03) 3px),
        repeating-linear-gradient(90deg, rgba(0,200,255,0.02) 0px, transparent 1px, transparent 3px, rgba(0,200,255,0.02) 4px);
      pointer-events: none;
      animation: matrix-scroll 20s linear infinite;
      z-index: 0;
    }

    @keyframes matrix-scroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(20px); }
    }

    .card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      width: 320px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      z-index: 1;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.02);
      color: #e6f7ff;
      box-sizing: border-box;
    }

    input::placeholder {
      color: rgba(230,247,255,0.5);
    }

    .btn {
      margin-top: 10px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, #00e5ff, #0066ff);
      color: #001;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(0,200,255,0.12);
      transition: box-shadow .12s, transform .08s;
      width: 100%;
    }

    .btn:hover {
      box-shadow: 0 8px 25px rgba(0,200,255,0.3);
    }

    .btn:active, .btn.active {
      box-shadow: 0 0 20px rgba(0,230,255,0.9);
      transform: translateY(2px) scale(0.995);
    }

    h1 {
      margin: 0 0 20px 0;
      text-shadow: 0 0 10px rgba(0,212,255,0.5);
    }
  </style>
</head>
<body class="futuristic">
  <div class="card">
    <h1>Registro</h1>
    <form action="{{ url_for('register') }}" method="post">
        <input name="nombre" placeholder="Nombre" required>
        <input name="apellidos" placeholder="Apellidos" required>
        <input name="edad" type="number" placeholder="Edad" required>
        <input name="email" placeholder="Email" value="{{ pre_email }}" required>
        <input name="password" type="password" placeholder="Contraseña" required>
        <input name="telefono" placeholder="Teléfono">
        <input name="usuario" placeholder="Elegir nombre de usuario" value="{{ pre_user }}" required>
      <button class="btn" type="submit">Crear cuenta</button>
    </form>
  </div>
  <script>
    document.querySelectorAll('.btn').forEach(b=>{
      b.addEventListener('click', ()=>{ b.classList.add('active'); setTimeout(()=>b.classList.remove('active'),200); });
    });
  </script>
</body>
</html>
