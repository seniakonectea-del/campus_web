<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    body.futuristic {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f3ff 0%, #e8f4f8 50%, #f0e8ff 100%);
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #5a6c7d;
      position: relative;
    }
    
    /* Formas geométricas tenues de fondo */
    body.futuristic::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(200,230,255,0.15) 0%, transparent 20%),
        radial-gradient(circle at 80% 70%, rgba(220,200,255,0.12) 0%, transparent 25%),
        radial-gradient(circle at 50% 50%, rgba(180,220,240,0.08) 0%, transparent 30%);
      pointer-events: none;
      animation: gentle-shift 40s ease-in-out infinite;
      z-index: -2;
    }

    @keyframes gentle-shift {
      0% { opacity: 0.7; }
      50% { opacity: 0.9; }
      100% { opacity: 0.7; }
    }

    /* Efecto suave */
    body.futuristic::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(100,150,200,0.15);
      width: 320px;
      text-align: center;
      border: 1px solid rgba(150,180,220,0.3);
      position: relative;
      z-index: 1;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid rgba(100,150,200,0.3);
      background: rgba(255,255,255,0.5);
      color: #5a6c7d;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      background: rgba(255,255,255,0.8);
      border-color: rgba(100,150,200,0.6);
      box-shadow: 0 0 0 3px rgba(100,150,200,0.1);
    }

    input::placeholder {
      color: rgba(100,130,160,0.6);
    }

    .btn {
      margin-top: 10px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #a8d5ff, #b8c5ff);
      color: #5a6c7d;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(100,150,200,0.2);
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn:hover {
      background: linear-gradient(135deg, #90c8f8, #a0b8f5);
      box-shadow: 0 6px 20px rgba(100,150,200,0.3);
      transform: translateY(-2px);
    }

    .btn:active, .btn.active {
      box-shadow: 0 2px 8px rgba(100,150,200,0.2);
      transform: translateY(0);
    }

    h1 {
      margin: 0 0 20px 0;
      color: #4a5c7d;
      font-size: 28px;
      font-weight: 600;
    }

    p a {
      color: #7a9fd0;
      text-decoration: none;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    p a:hover {
      color: #5a7faa;
      text-decoration: underline;
    }

    p {
      color: #7a9cbd;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body class="futuristic">
  <div class="card">
    <h1>Iniciar sesión</h1>
    <form action="{{ url_for('login') }}" method="post">
      <input name="user" placeholder="Usuario" required>
      <input name="Email" placeholder="Email (opcional)">
      <input name="password" type="password" placeholder="Contraseña" required>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <p>¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate</a></p>
  </div>
  <script>
    document.querySelectorAll('.btn').forEach(b=>{
      b.addEventListener('click', ()=>{ b.classList.add('active'); setTimeout(()=>b.classList.remove('active'),200); });
    });
  </script>
</body>
</html>
